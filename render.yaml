services:
  - type: web
    name: emotisense-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGODB_URL
        sync: false          # Set this manually in Render dashboard (your Atlas URI)
      - key: DATABASE_NAME
        value: emotion_app
      - key: SECRET_KEY
        sync: false          # Set this manually in Render dashboard
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        sync: false          # Set to your frontend URL, e.g. https://your-app.vercel.app
